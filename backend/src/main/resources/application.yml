spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_redis_demo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      # 10-minute TTL; entries survive long enough for demo purposes
      time-to-live: 600000

server:
  port: 8080

logging:
  level:
    com.purplevarun.springredisdemo: INFO

app:
  cache:
    # max number of individual entries kept in the 'numbers' cache; LRU evicts on overflow
    max-size: 3
